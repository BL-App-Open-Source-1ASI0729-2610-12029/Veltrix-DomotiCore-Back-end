spring:
  application:
    name: domoticore-backend
  datasource:
    url: jdbc:h2:mem:domoticore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

domoticore:
  jwt:
    secret: domoticore-dev-secret-change-in-production-min-256-bits-long-key!!
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.domoticore: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/domoticore}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:domoticore}
    password: ${DATABASE_PASSWORD:domoticore}
  jpa:
    hibernate:
      ddl-auto: validate
