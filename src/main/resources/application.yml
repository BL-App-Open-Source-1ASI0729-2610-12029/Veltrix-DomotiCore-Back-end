spring:
  application:
    name: domoticore-backend
  datasource:
    url: jdbc:h2:mem:domoticore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: com.domoticore.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

domoticore:
  jwt:
    secret: domoticore-dev-secret-change-in-production-min-256-bits-long-key!!
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.domoticore: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/domoticore
    driver-class-name: org.postgresql.Driver
    username: domoticore
    password: domoticore
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/domoticore}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:domoticore}
    password: ${DATABASE_PASSWORD:domoticore}
  h2:
    console:
      enabled: false

domoticore:
  jwt:
    secret: ${JWT_SECRET:domoticore-dev-secret-change-in-production-min-256-bits-long-key!!}
  cors:
    allowed-origins: ${DOMOTICORE_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
