# Render Blueprint: https://render.com/docs/blueprint-spec
# After deploy, verify domoticore-api is linked to domoticore-db (Connections tab).

databases:
  - name: domoticore-db
    databaseName: domoticore
    user: domoticore
    plan: free

services:
  - type: web
    name: domoticore-api
    runtime: docker
    plan: free
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: domoticore-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: domoticore-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: domoticore-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: DOMOTICORE_CORS_ORIGINS
        value: https://veltrix-domoti-core-front-end-omega.vercel.app,http://localhost:4200,http://127.0.0.1:4200
