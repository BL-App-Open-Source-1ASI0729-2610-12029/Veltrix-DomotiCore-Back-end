services:
  postgres:
    image: postgres:16-alpine
    container_name: domoticore-postgres
    environment:
      POSTGRES_DB: domoticore
      POSTGRES_USER: domoticore
      POSTGRES_PASSWORD: domoticore
    ports:
      - "5432:5432"
    volumes:
      - domoticore_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domoticore -d domoticore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  domoticore_pg_data:
